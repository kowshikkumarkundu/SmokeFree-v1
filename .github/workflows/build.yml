name: SmokeFree APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Extract Project ZIP
        run: |
          unzip -q SmokeFree-with-reason-history.zip -d extracted

      - name: Make Gradle Executable
        run: chmod +x extracted/SmokeFree/gradlew

      - name: Build Debug APK
        working-directory: extracted/SmokeFree
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmokeFree-APK
          path: extracted/SmokeFree/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
